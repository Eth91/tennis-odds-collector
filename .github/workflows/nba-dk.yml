name: nba-dk
# DraftKings for the NBA engine on the VM (NBA_SPEED_PREREG.md amendment 4).
#
# DraftKings Akamai-blocks the Oracle VM but serves GitHub's Azure runners with curl_cffi browser
# impersonation (dk-ip-probe: 3 of 3 runners, 2026-09-03). This job fetches DraftKings every 3 min
# through the game-day window and ships each snapshot straight to the VM over ssh, using a
# SINGLE-PURPOSE key: its authorized_keys entry is `restrict,command=...nba_dk_receive.py`, so it
# can only hand over one validated snapshot file. It cannot open a shell or touch anything else.
#
# IT NEVER PUSHES. The previous GitHub account was suspended on 2026-08-04, most likely by an
# automated flag on high-frequency pushes. This writes nothing to git.
#
# CADENCE. GitHub drops and delays frequent schedule ticks, so ONE long-lived job loops (up to 5.5 h)
# and re-dispatches itself while the window is open. The three daily seeds only restart the chain if
# it broke (morning seeds every ~30 min from 15:13Z, amendment 25). The concurrency group keeps it to
# a single chain: one running, at most one pending.
# Window 15:00-06:00 UTC (9 AM to midnight MT): news, triggers and every close, late West-coast
# tips included. Outside it nothing runs. The Mac's nba_dk_push.sh still sends whenever the Mac is
# awake, and the receiver keeps whichever snapshot is newest.

on:
  schedule:
    - cron: "5 15 * * *"
    # AMENDMENT 25: morning seeds at off-peak minutes. On 10/24 and 10/25 the 15:05 seed ran 3 h late
    # and DraftKings was dark 9 AM to ~12:20 PM MT, the news window. Extra seeds queue behind a
    # running chain (concurrency: one running, one pending), so they never start a second chain.
    - cron: "13 15 * * *"
    - cron: "41 15 * * *"
    - cron: "13 16 * * *"
    - cron: "41 16 * * *"
    - cron: "13 17 * * *"
    - cron: "41 17 * * *"
    - cron: "35 18 * * *"
    - cron: "5 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write            # the self re-dispatch

concurrency:
  group: nba-dk
  cancel-in-progress: false

env:
  VM: ubuntu@155.248.217.149
  WINDOW_START_UTC: "15"
  WINDOW_END_UTC: "6"

jobs:
  dk:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            nba_lines.py
            nba_rosters.py
            dk_collect.py
            nfl_lines.py
            nfl_common.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: python -m pip install --quiet curl_cffi requests

      - name: the single-purpose key, and the VM's pinned host key
        env:
          KEY: ${{ secrets.NBA_DK_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/nba_dk
          chmod 600 ~/.ssh/nba_dk
          # verified 2026-10-23: scan == the Mac's known_hosts == /etc/ssh on the box
          echo "155.248.217.149 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPzbro129cAdTBijf5TdwJE5ijq17y+9CsqCLiYbXuSb" > ~/.ssh/known_hosts

      - name: fetch DraftKings and ship to the VM every 3 min
        # NFL (nfl_lines.py) rides the same loop AFTER the NBA send: same key, same receiver (it writes an NFL-marked
        # snapshot to its own file). Its failures are counted apart and never fail the job; a hung NFL fetch is cut
        # at 90 s, inside the 3-min tick.
        run: |
          in_window() { h=$((10#$(date -u +%H))); [ "$h" -ge "$WINDOW_START_UTC" ] || [ "$h" -lt "$WINDOW_END_UTC" ]; }
          stop=$(( $(date +%s) + 330 * 60 ))
          ok=0; bad=0; nfl_ok=0; nfl_bad=0
          while [ "$(date +%s)" -lt "$stop" ] && in_window; do
            if timeout 120 python nba_lines.py --snapshot dk /tmp/dk.json \
               && timeout 60 ssh -i ~/.ssh/nba_dk -o BatchMode=yes -o ConnectTimeout=15 \
                    -o StrictHostKeyChecking=yes "$VM" < /tmp/dk.json; then
              ok=$((ok + 1))
            else
              bad=$((bad + 1))
              echo "cycle failed at $(date -u +%T)"
            fi
            if timeout 90 python nfl_lines.py --snapshot dk /tmp/dk_nfl.json \
               && timeout 45 ssh -i ~/.ssh/nba_dk -o BatchMode=yes -o ConnectTimeout=15 \
                    -o StrictHostKeyChecking=yes "$VM" < /tmp/dk_nfl.json; then
              nfl_ok=$((nfl_ok + 1))
            else
              nfl_bad=$((nfl_bad + 1))
              echo "nfl cycle failed at $(date -u +%T)"
            fi
            sleep $(( 180 - $(date +%s) % 180 ))
          done
          echo "cycles ok=$ok failed=$bad · nfl ok=$nfl_ok failed=$nfl_bad"
          [ "$ok" -gt 0 ] || [ "$bad" -eq 0 ]

      - name: re-dispatch while the window is open
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$((10#$(date -u +%H)))
          if [ "$h" -ge "$WINDOW_START_UTC" ] || [ "$h" -lt "$WINDOW_END_UTC" ]; then
            gh workflow run nba-dk.yml --ref main -R "$GITHUB_REPOSITORY" && echo "re-dispatched"
          else
            echo "window closed; the next seed restarts it tomorrow"
          fi
